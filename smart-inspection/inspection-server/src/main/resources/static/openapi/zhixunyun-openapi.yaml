    InspectionPlanSaveRequest:
      type: object
      required: [name, inspectorId, frequencyType, executionTime, startDate, equipmentIds, inspectionItemIds]
      description: WEEKLY 时 weekDays 必填；MONTHLY 时 monthDays 必填；所选设备需属于同一设备类型。
      properties:
        name: { type: string, maxLength: 100, example: A1 机房 UPS 日常巡检 }
        inspectorId: { type: integer, format: int64, example: 2 }
        frequencyType: { $ref: '#/components/schemas/FrequencyType' }
        executionTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '09:00' }
        weekDays:
          type: array
          description: 周一为 1，周日为 7；仅 WEEKLY 使用
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
          example: [1, 3, 5]
        monthDays:
          type: array
          description: 仅 MONTHLY 使用，为避免短月问题限制为 1 至 28
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 28 }
          example: [1, 15]
        startDate: { type: string, format: date, example: '2026-09-01' }
        endDate: { type: string, format: date, nullable: true, example: '2027-08-31' }
        deadlineHours: { type: integer, minimum: 1, maximum: 168, default: 24, example: 24 }
        equipmentIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, format: int64 }
          example: [1, 2]
        inspectionItemIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, format: int64 }
          example: [1, 2, 3]
        remark: { type: string, maxLength: 500 }
