openapi: 3.0.3
info:
  title: 智巡云完整 API 接口契约
  version: 1.0.0-draft
  description: |
    智巡云——智能设备巡检与故障工单平台的完整接口设计。

    本文档采用“契约先行”方式编写，既包含当前已经开发完成的接口，也包含后续模块的规划接口。
    每个接口都使用 `x-implementation-status` 标记实现状态：

    - `IMPLEMENTED`：当前后端已经实现，可以实际调用。
    - `PLANNED`：接口契约已经确定，但 Controller / Service / Mapper 尚未开发，当前调用会返回 404。

    除登录接口外，所有接口都需要 JWT。请先调用登录接口，然后在 Knife4j 的 Authorize 中填写返回的 token。
    统一响应结构为 `{ code, message, data }`，其中 `code = 0` 表示成功。
  contact:
    name: 智巡云项目组
servers:
  - url: http://localhost:8080
    description: 本地开发环境
tags:
  - name: 01. 认证管理
    description: 登录与身份认证
  - name: 02. 用户管理
    description: 当前用户和管理员用户管理
  - name: 03. 区域管理
    description: 设备所属园区、楼栋、车间或机房区域
  - name: 04. 设备类型管理
    description: 设备分类和类型维护
  - name: 05. 设备管理
    description: 设备档案、状态和查询
  - name: 06. 巡检项目管理
    description: 不同设备类型的检查标准
  - name: 07. 巡检计划管理
    description: 巡检周期、人员、设备和项目配置
  - name: 08. 巡检任务管理
    description: 定时生成任务、执行巡检和提交结果
  - name: 09. 巡检记录
    description: 已完成巡检的不可变业务记录
  - name: 10. 异常记录
    description: 巡检发现的设备异常
  - name: 11. 维修工单
    description: 派单、接单、维修、验收和关闭
  - name: 12. 消息通知
    description: 工单和验收消息
  - name: 13. 文件管理
    description: 巡检、故障和维修图片上传
  - name: 14. 数据统计
    description: 工作台指标和趋势分析
security:
  - BearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [01. 认证管理]
      summary: 【已实现】用户登录
      operationId: login
      x-implementation-status: IMPLEMENTED
      x-roles: [PUBLIC]
      security: []
      description: 使用登录账号和密码换取 JWT。登录失败时不会返回 token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            examples:
              admin:
                summary: 管理员登录
                value:
                  username: admin
                  password: '123456'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResult'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/LoginFailed'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me:
    get:
      tags: [02. 用户管理]
      summary: 【已实现】获取当前用户信息
      operationId: getCurrentUser
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN, INSPECTOR, MAINTAINER]
      description: JWT 拦截器将 userId 写入 ThreadLocal，本接口按该 userId 查询当前用户。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users:
    get:
      tags: [02. 用户管理]
      summary: 【已实现】分页查询用户
      operationId: pageUsers
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: username
          in: query
          description: 登录账号，支持模糊匹配
          schema: { type: string, maxLength: 32 }
        - name: displayName
          in: query
          description: 展示名称，支持模糊匹配
          schema: { type: string, maxLength: 50 }
        - name: roleCode
          in: query
          schema: { $ref: '#/components/schemas/RoleCode' }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPageResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [02. 用户管理]
      summary: 【已实现】新增用户
      operationId: createUser
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '200':
          description: 创建成功，返回用户 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users/options:
    get:
      tags: [02. 用户管理]
      summary: 【已实现】查询用户下拉选项
      operationId: listUserOptions
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      description: 创建巡检计划或派发工单时使用，只返回启用用户的最小字段。
      parameters:
        - name: roleCode
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RoleCode' }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 50 }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOptionListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [02. 用户管理]
      summary: 【已实现】查询用户详情
      operationId: getUser
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [02. 用户管理]
      summary: 【已实现】修改用户基本信息
      operationId: updateUser
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      description: 登录账号和密码不通过此接口修改。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [02. 用户管理]
      summary: 【已实现】启用或禁用用户
      operationId: changeUserStatus
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      description: 禁止管理员禁用自己；禁用后新请求无法继续通过身份校验。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnabledStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users/{userId}/password/reset:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [02. 用户管理]
      summary: 【已实现】管理员重置用户密码
      operationId: resetUserPassword
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/areas:
    get:
      tags: [03. 区域管理]
      summary: 【已实现】分页查询区域
      operationId: pageAreas
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaPageResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [03. 区域管理]
      summary: 【已实现】新增区域
      operationId: createArea
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaSaveRequest' }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/areas/options:
    get:
      tags: [03. 区域管理]
      summary: 【已实现】查询启用区域选项
      operationId: listAreaOptions
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaOptionListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/areas/{areaId}:
    parameters:
      - $ref: '#/components/parameters/AreaId'
    get:
      tags: [03. 区域管理]
      summary: 【已实现】查询区域详情
      operationId: getArea
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaDetailResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [03. 区域管理]
      summary: 【已实现】修改区域
      operationId: updateArea
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaSaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/areas/{areaId}/status:
    parameters:
      - $ref: '#/components/parameters/AreaId'
    patch:
      tags: [03. 区域管理]
      summary: 【已实现】启用或停用区域
      operationId: changeAreaStatus
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      description: 区域仍有关联设备时不允许停用。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnabledStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/equipment-types:
    get:
      tags: [04. 设备类型管理]
      summary: 分页查询设备类型
      operationId: pageEquipmentTypes
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentTypePageResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [04. 设备类型管理]
      summary: 新增设备类型
      operationId: createEquipmentType
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentTypeSaveRequest' }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/equipment-types/options:
    get:
      tags: [04. 设备类型管理]
      summary: 查询启用设备类型选项
      operationId: listEquipmentTypeOptions
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentTypeOptionListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/equipment-types/{equipmentTypeId}:
    parameters:
      - $ref: '#/components/parameters/EquipmentTypeId'
    get:
      tags: [04. 设备类型管理]
      summary: 查询设备类型详情
      operationId: getEquipmentType
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentTypeDetailResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [04. 设备类型管理]
      summary: 修改设备类型
      operationId: updateEquipmentType
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentTypeSaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/equipment-types/{equipmentTypeId}/status:
    parameters:
      - $ref: '#/components/parameters/EquipmentTypeId'
    patch:
      tags: [04. 设备类型管理]
      summary: 启用或停用设备类型
      operationId: changeEquipmentTypeStatus
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      description: 类型下仍有启用设备时不允许停用。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnabledStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/equipment:
    get:
      tags: [05. 设备管理]
      summary: 【已实现】分页查询设备
      operationId: pageEquipment
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - name: equipmentTypeId
          in: query
          schema: { type: integer, format: int64 }
        - name: areaId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EquipmentStatus' }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentPageResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [05. 设备管理]
      summary: 【已实现】新增设备
      operationId: createEquipment
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentSaveRequest' }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/equipment/options:
    get:
      tags: [05. 设备管理]
      summary: 【已实现】查询可巡检设备选项
      operationId: listEquipmentOptions
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      description: 创建巡检计划时使用，只返回状态正常且未停用的设备。
      parameters:
        - name: equipmentTypeId
          in: query
          schema: { type: integer, format: int64 }
        - name: areaId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentOptionListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/equipment/{equipmentId}:
    parameters:
      - $ref: '#/components/parameters/EquipmentId'
    get:
      tags: [05. 设备管理]
      summary: 【已实现】查询设备详情
      operationId: getEquipment
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN, INSPECTOR, MAINTAINER]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentDetailResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [05. 设备管理]
      summary: 【已实现】修改设备
      operationId: updateEquipment
      x-implementation-status: IMPLEMENTED
      x-roles: [ADMIN]
      description: 设备业务状态不能通过此接口随意修改。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentSaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [05. 设备管理]
      summary: 【已实现】删除未被业务引用的设备
