          schema: { type: string, format: date }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderPageResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/work-orders/{workOrderId}:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
    get:
      tags: [11. 维修工单]
      summary: 【规划】查询维修工单详情
      operationId: getWorkOrder
      x-implementation-status: PLANNED
      x-roles: [ADMIN, MAINTAINER]
      description: 维修人员只能查询派给自己的工单。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderDetailResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/work-orders/{workOrderId}/assign:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
    post:
      tags: [11. 维修工单]
      summary: 【规划】派发或重新派发工单
      operationId: assignWorkOrder
      x-implementation-status: PLANNED
      x-roles: [ADMIN]
      description: |
        首次派单：PENDING_ASSIGNMENT → PENDING_ACCEPTANCE。
        未接单前允许重新指定维修人员，状态仍为 PENDING_ACCEPTANCE。
        后端使用“工单 ID + 当前状态”的条件更新保证并发下只有一次有效操作。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderAssignRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/work-orders/{workOrderId}/accept:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
    post:
      tags: [11. 维修工单]
      summary: 【规划】接单并开始维修
      operationId: acceptWorkOrder
      x-implementation-status: PLANNED
      x-roles: [MAINTAINER]
      description: 仅被指派的维修人员可将 PENDING_ACCEPTANCE 变为 PROCESSING；重复接单返回 409。
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/work-orders/{workOrderId}/submit-result:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
    post:
      tags: [11. 维修工单]
      summary: 【规划】提交维修结果
      operationId: submitWorkOrderResult
      x-implementation-status: PLANNED
      x-roles: [MAINTAINER]
      description: 仅负责人可将 PROCESSING 变为 PENDING_VERIFICATION，并保存维修说明和现场图片。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderResultSubmitRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/work-orders/{workOrderId}/verify:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
    post:
      tags: [11. 维修工单]
      summary: 【规划】验收维修工单
      operationId: verifyWorkOrder
      x-implementation-status: PLANNED
      x-roles: [ADMIN]
      description: |
        仅 PENDING_VERIFICATION 可验收。
        通过：变为 COMPLETED，同时关闭异常并恢复设备状态。
        不通过：变为 REJECTED，维修人员需要重新处理。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderVerifyRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/work-orders/{workOrderId}/rework:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
    post:
      tags: [11. 维修工单]
      summary: 【规划】开始返工
      operationId: reworkWorkOrder
      x-implementation-status: PLANNED
      x-roles: [MAINTAINER]
      description: 仅负责人可将 REJECTED 变回 PROCESSING。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemarkRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/work-orders/{workOrderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
    post:
      tags: [11. 维修工单]
      summary: 【规划】取消工单
      operationId: cancelWorkOrder
      x-implementation-status: PLANNED
      x-roles: [ADMIN]
      description: 仅 PENDING_ASSIGNMENT 或 PENDING_ACCEPTANCE 可以取消；取消原因必须保留在操作记录中。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/work-orders/{workOrderId}/operations:
    parameters:
      - $ref: '#/components/parameters/WorkOrderId'
    get:
      tags: [11. 维修工单]
      summary: 【规划】查询工单操作记录
      operationId: listWorkOrderOperations
      x-implementation-status: PLANNED
      x-roles: [ADMIN, MAINTAINER]
      description: 按时间升序返回派单、接单、提交、验收、返工和取消记录。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderOperationListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/notifications:
    get:
      tags: [12. 消息通知]
      summary: 【规划】分页查询我的通知
      operationId: pageNotifications
      x-implementation-status: PLANNED
      x-roles: [ADMIN, INSPECTOR, MAINTAINER]
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/NotificationType' }
        - name: read
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPageResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/unread-count:
    get:
      tags: [12. 消息通知]
      summary: 【规划】查询未读通知数
      operationId: getUnreadNotificationCount
      x-implementation-status: PLANNED
      x-roles: [ADMIN, INSPECTOR, MAINTAINER]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCountResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    patch:
      tags: [12. 消息通知]
      summary: 【规划】将通知标为已读
      operationId: readNotification
      x-implementation-status: PLANNED
      x-roles: [ADMIN, INSPECTOR, MAINTAINER]
      description: 只能操作属于当前用户的通知；重复标记按幂等成功处理。
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/notifications/read-all:
    patch:
      tags: [12. 消息通知]
      summary: 【规划】全部标为已读
      operationId: readAllNotifications
      x-implementation-status: PLANNED
      x-roles: [ADMIN, INSPECTOR, MAINTAINER]
      responses:
        '200': { $ref: '#/components/responses/SuccessVoid' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/files/images:
    post:
      tags: [13. 文件管理]
      summary: 【规划】上传业务图片
      operationId: uploadImage
      x-implementation-status: PLANNED
      x-roles: [ADMIN, INSPECTOR, MAINTAINER]
      description: 上传到 MinIO，数据库业务表只保存 objectKey 和访问 URL。支持 JPEG、PNG、WEBP，单文件不超过 10MB。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bizType]
              properties:
                file:
                  type: string
                  format: binary
                bizType:
                  $ref: '#/components/schemas/FileBizType'
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileUploadResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: 文件超过大小限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResult' }

  /api/statistics/dashboard:
    get:
      tags: [14. 数据统计]
      summary: 【规划】查询工作台核心指标
      operationId: getDashboardStatistics
      x-implementation-status: PLANNED
      x-roles: [ADMIN, INSPECTOR, MAINTAINER]
      description: 按角色返回有权限查看的统计值；巡检员和维修人员只统计自己的任务或工单。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStatisticsResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/statistics/work-orders/trend:
    get:
      tags: [14. 数据统计]
      summary: 【规划】查询工单趋势
      operationId: getWorkOrderTrend
      x-implementation-status: PLANNED
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/TimeGranularity'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderTrendResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/statistics/faults/distribution:
    get:
      tags: [14. 数据统计]
      summary: 【规划】查询异常等级分布
      operationId: getFaultDistribution
      x-implementation-status: PLANNED
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaultDistributionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/statistics/equipment/status-distribution:
    get:
      tags: [14. 数据统计]
      summary: 【规划】查询设备状态分布
      operationId: getEquipmentStatusDistribution
      x-implementation-status: PLANNED
      x-roles: [ADMIN]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentStatusDistributionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录后填写返回的 token，不需要手动输入 Bearer 前缀

  parameters:
    PageNum:
      name: pageNum
      in: query
      required: true
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: true
      description: 每页数量，最大 100
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Keyword:
      name: keyword
      in: query
      required: false
      description: 编码或名称关键字，支持模糊匹配
      schema: { type: string, maxLength: 50 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    AreaId:
      name: areaId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    EquipmentTypeId:
      name: equipmentTypeId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    InspectionItemId:
      name: inspectionItemId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    InspectionPlanId:
      name: inspectionPlanId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    InspectionTaskId:
      name: inspectionTaskId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    InspectionRecordId:
      name: inspectionRecordId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    FaultRecordId:
      name: faultRecordId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    WorkOrderId:
      name: workOrderId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    StartDate:
      name: startDate
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-08-01' }
    EndDate:
      name: endDate
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-08-31' }
    TimeGranularity:
      name: granularity
      in: query
      required: false
      schema:
        type: string
        enum: [DAY, WEEK, MONTH]
        default: DAY

  responses:
    SuccessVoid:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VoidResult' }
    ValidationError:
      description: 请求参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
          example:
            code: 10001
            message: 请求参数校验失败
            data: null
    LoginBadRequest:
      description: 登录参数校验失败或用户不存在（与当前代码行为一致）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
          examples:
            validationFailed:
              value: { code: 10001, message: 用户名不能为空, data: null }
            userNotFound:
              value: { code: 11006, message: 用户不存在, data: null }
    LoginFailed:
      description: 用户名或密码错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
          example:
            code: 11001
            message: 用户名或密码错误
            data: null
    AccountDisabled:
      description: 用户账号已被禁用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
          example:
            code: 11002
            message: 用户账号已被禁用
            data: null
    Unauthorized:
      description: 未携带 Token、Token 无效或已过期
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
          examples:
            tokenMissing:
              value: { code: 11003, message: 请求未携带 Token, data: null }
            tokenInvalid:
              value: { code: 11004, message: Token 无效或已过期, data: null }
    Forbidden:
      description: 当前用户无权执行该操作
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
          example: { code: 11005, message: 当前用户无权执行该操作, data: null }
    NotFound:
      description: 指定的业务数据不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
          example: { code: 13001, message: 数据不存在, data: null }
    Conflict:
      description: 唯一值冲突、重复操作、状态不允许或并发更新失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
          example: { code: 15004, message: 数据状态已变化，请刷新后重试, data: null }
    InternalError:
      description: 系统内部异常
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResult' }
          example: { code: 50000, message: 系统内部异常, data: null }

  schemas:
    RoleCode:
      type: string
      description: ADMIN-系统管理员，INSPECTOR-巡检员，MAINTAINER-维修人员
      enum: [ADMIN, INSPECTOR, MAINTAINER]
      example: ADMIN
    EquipmentStatus:
      type: string
      description: NORMAL-正常，FAULT-故障，IN_REPAIR-维修中，DISABLED-已停用
      enum: [NORMAL, FAULT, IN_REPAIR, DISABLED]
    InspectionResultType:
      type: string
      description: BOOLEAN-正常/异常，NUMBER-数值，TEXT-文本
      enum: [BOOLEAN, NUMBER, TEXT]
    FrequencyType:
      type: string
      description: 巡检周期类型
      enum: [DAILY, WEEKLY, MONTHLY]
    InspectionTaskStatus:
      type: string
      description: PENDING-待巡检，IN_PROGRESS-巡检中，COMPLETED-已完成，OVERDUE-已逾期，CANCELLED-已取消
      enum: [PENDING, IN_PROGRESS, COMPLETED, OVERDUE, CANCELLED]
    FaultLevel:
      type: string
      description: LOW-低，MEDIUM-中，HIGH-高，URGENT-紧急
      enum: [LOW, MEDIUM, HIGH, URGENT]
    FaultStatus:
      type: string
      description: REPORTED-已上报，ORDER_CREATED-已创建工单，PROCESSING-处理中，RESOLVED-已解决，CLOSED-已关闭
      enum: [REPORTED, ORDER_CREATED, PROCESSING, RESOLVED, CLOSED]
    WorkOrderPriority:
      type: string
      description: LOW-低，MEDIUM-中，HIGH-高，URGENT-紧急
      enum: [LOW, MEDIUM, HIGH, URGENT]
    WorkOrderStatus:
      type: string
      description: 待派单 → 待接单 → 处理中 → 待验收 → 已完成；验收失败进入已驳回
      enum:
        - PENDING_ASSIGNMENT
        - PENDING_ACCEPTANCE
        - PROCESSING
        - PENDING_VERIFICATION
        - COMPLETED
        - REJECTED
        - CANCELLED
    NotificationType:
      type: string
      enum: [WORK_ORDER_ASSIGNED, URGENT_FAULT, VERIFICATION_PASSED, VERIFICATION_REJECTED]
    FileBizType:
      type: string
      enum: [INSPECTION, FAULT, REPAIR]
    WorkOrderOperationType:
      type: string
      enum: [CREATE, ASSIGN, REASSIGN, ACCEPT, SUBMIT_RESULT, VERIFY_PASS, VERIFY_REJECT, REWORK, CANCEL]

    ResultBase:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功
          example: 0
        message:
          type: string
          example: success
    ErrorResult:
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null
    VoidResult:
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null
    IdData:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64, example: 1 }
    IdResult:
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/IdData' }
    PageMeta:
      type: object
      required: [pageNum, pageSize, total]
      properties:
        pageNum: { type: integer, example: 1 }
        pageSize: { type: integer, example: 10 }
        total: { type: integer, format: int64, example: 36 }
    OptionItem:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer, format: int64, example: 1 }
        code: { type: string, example: CODE001 }
